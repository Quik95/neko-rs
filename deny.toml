# cargo-deny configuration. Run `cargo deny check` (available in the dev shell).
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# nekors ships under EUPL-1.2, which is a copyleft licence: a dependency may not
# impose terms that conflict with redistributing the combined work under it.
# Permissive licences are fine; anything else needs a deliberate decision here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "BSL-1.0",
]
confidence-threshold = 0.93
# The workspace crates are EUPL-1.2 and unpublished; the allowlist above is
# about what we pull in, not about ourselves.
private = { ignore = true }
# Keep the allowlist forward-looking without warning about entries no current
# dependency happens to use.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path, which has no version to
# pin; that is not the unpinned-registry-crate hazard this check is for.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
